# FONT
font_family                         family='JetBrainsMono Nerd Font Mono' postscript_name=JetBrainsMonoNFM-Regular
bold_font                           auto
italic_font                         auto
bold_italic_font                    auto
font_size                           11
#adjust_line_height                 125%
modify_font cell_height             120%
#modify_font strikethrough_position 150%

# OPTIONS
enable_audio_bell        0
hide_window_decorations  yes
#hide_window_decorations titlebar-only
window_padding_width     0
#window_padding_width    10
scrollback_lines         10000
mouse_hide_wait          0.5
underline_hyperlinks     always
copy_on_select           clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append
draw_minimal_borders     yes
# REALLY FAST TOUCH SCROLL:
#touch_scroll_multiplier  6.0
# MORE SENSIBLE:
touch_scroll_multiplier  2.0

# THEME
#include current-theme.conf
# Cursor
cursor                       #00ff00
cursor_text_color            background
#cursor                      #545c7e
#cursor_text_color           #c0caf5
cursor_shape                 underline
shell_integration            no-cursor
cursor_shape_unfocused       hollow
cursor_underline_thickness   1.3
cursor_blink_interval        1.2 linear ease-in-out
#cursor_blink_interval       0
# STRONG ANIMATION
#cursor_trail                 20
#cursor_trail_start_threshold 1
#cursor_trail_decay           0.0 0.15
# LESS ANIMATION
cursor_trail                 80
cursor_trail_start_threshold 2
cursor_trail_decay           0.05 0.20

# Tabs
active_tab_foreground   #000000
active_tab_background   #db12ba
active_tab_font_style	bold
inactive_tab_foreground #db12ba
inactive_tab_background #161616
inactive_tab_font_style	normal

# Colors
foreground                 #ffffff
background                 #000000
# Tokyo night regular
#background                #222436
# Tokyo night night
#background                #1a1b26
selection_foreground       #000000
selection_background       #00ff00
scrollbar_handle_color     #00ff00
#url_color                 #1f38f2
url_color                  #7aa2f7
wayland_titlebar_color     background

# black
color0  #1c1c1c
color8  #585858
# red
color1  #FF0000
color9  #5faf5f
# green
color2  #00ff00
color10 #afd700
# yellow
color3  #ffff00
color11 #af87d7
# blue
color4  #1f38f2
color12 #ffaf00
# magenta
color5  #db12ba
color13 #ff5faf
# cyan
color6  #47f5e9
color14 #00afaf
# white
color7  #ffffff
color15 #5f8787

#map cmd+enter # no-op instead of splitting window

