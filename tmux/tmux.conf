###########
# OPTIONS #
###########
# Use Vi mode
setw -g mode-keys vi
# Increase scrollback buffer size
set -g history-limit 10000
# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1
# Allow automatic renaming of windows
#set -g allow-rename on
# Automatic renaming
set -g automatic-rename on
set -g allow-rename off
# Renumber windows when one is removed.
set -g renumber-windows on
# Enable undercurl
#set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Enable undercurl colors
#set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# Enable hyperlinks
#set -as terminal-overrides ',*:Hls=\E]8;id=%p1%s;%p2%s\E\\:Hlr=\E]8;;\E\\'
# Replacement for older syntax above:
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,clipboard,focus,hyperlinks,usstyle,extkeys"
# Allow the mouse to resize windows and select tabs
set -g mouse on
# Allow tmux to set the terminal title
set -g set-titles on
# Monitor window activity to display in the status bar
setw -g monitor-activity on
# A bell in another window should cause a bell in the current window
setw -g monitor-bell on
set -g activity-action other
set -g bell-action other
# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off
# Focus events enabled for terminals that support them
set -g focus-events on
# Useful when using sharing a session with different size terminals
#setw -g aggressive-resize on
setw -g aggressive-resize off
# don't detach tmux when killing a session
set -g detach-on-destroy off
# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

set -s set-clipboard external




###############
# STATUS LINE #
###############
# Status line customisation
set-option -g status-left-length 100
set-option -g status-right-length 100
set-option -g status-left " #{session_name}  "
set-option -g status-right "#{pane_title} "
set-option -g status-style "fg=#545c7e bg=default"
#set-option -g window-status-format "#{window_index}:#{pane_current_command} "
set -g window-status-format " #{window_index}:#{pane_current_command}#{window_flags} "
#set-option -g window-status-current-format "#[fg=E9E9EA]#{window_index}:#{pane_current_command} "
set -g window-status-current-format " #{window_index}:#{pane_current_command}#{window_flags} "

set -g window-status-current-style "fg=#E9E9EA,bold"
set -g window-status-activity-style "fg=#db12ba,bold"
set -g window-status-bell-style "fg=#ff0000,bold"
#set-option -g window-status-current-style "fg=#E9E9EA"
#set-option -g window-status-activity-style none
#set-option -g pane-active-border-style "fg=#1f2335"
#set-option -g pane-border-style "fg=#1f2335"
set -g pane-border-style "fg=#1f2335"
set -g pane-active-border-style "fg=#db12ba"




################
# KEY BINDINGS #
################
# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix
# Set the prefix to Ctrl+Space
set -g prefix C-Space
# Send prefix to a nested tmux session by doubling the prefix
bind C-Space send-prefix
# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display-message 'tmux.conf reloaded'
# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window
# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window
# Move the current window to the next window or previous window position
#bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
#bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"
bind -r N swap-window -d -t +1
bind -r P swap-window -d -t -1
# Use < and > to move window tabs to left or right
bind-key > swap-window -t +1 \; next
bind-key < swap-window -t -1 \; prev
# Switch between two most recently used windows
bind Space last-window
# Switch between two most recently used sessions
bind ^ switch-client -l
# use PREFIX+| (or PREFIX+\) to split window horizontally and PREFIX+- or
# (PREFIX+_) to split vertically also use the current pane path to define the
# new pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Change the path for newly created windows
bind c new-window -c "#{pane_current_path}"
# Setup 'v' to begin selection as in Vim
#if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' \
#    'bind-key -T copy-mode-vi v send-keys -X begin-selection;'
#if-shell '[[ $(uname -s) == "Darwin" ]]' {
#    bind y run -b "tmux show-buffer | pbcopy"\; display-message "Copied tmux buffer to system clipboard"
#} {
#    bind y run -b "tmux show-buffer | xclip -selection clipboard"\; display-message "Copied tmux buffer to system clipboard"
#}
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
#bind-key -r F new-window t
#bind-key -r D run-shell "t ~/Code/abs-puppet"
#bind-key -r H run-shell "t ~"
bind F new-window "/home/kayleigh/.local/bin/t"
bind D run-shell "/home/kayleigh/.local/bin/t ~/Code/abs-puppet"
bind H run-shell "/home/kayleigh/.local/bin/t ~"

